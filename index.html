  };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window._firebaseDB = firebase.database();
  console.log('🔥 Firebase DB pronto');
  // Badge
  (function(){
    function getBadge(){
      let el=document.getElementById('firebase-status-badge');
      if(!el){
        el=document.createElement('div');
        el.id='firebase-status-badge';
        el.style.cssText='position:fixed;bottom:16px;right:16px;z-index:2147483647;background:#0f172a;color:white;padding:10px 14px;border-radius:9999px;font-size:11px;font-family:system-ui;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)';
        el.innerHTML='<span style="width:8px;height:8px;background:#fbbf24;border-radius:50%;display:inline-block;animation:fbpulse 1.5s infinite"></span> Conectando Firebase...';
        document.body.appendChild(el);
        const st=document.createElement('style'); st.textContent='@keyframes fbpulse{0%,100%{opacity:1}50%{opacity:.3}}'; document.head.appendChild(st);
      }
      return el;
    }
    function setBadge(h,bg){ const el=getBadge(); el.innerHTML=h; if(bg) el.style.background=bg; window._fbBadgeSet=true; }
    const db = window._firebaseDB;
    let isSyncingFromFirebase=false;
    let saveTimeout=null;
    window._fbScheduleSave = function(){
      if(isSyncingFromFirebase) return;
      clearTimeout(saveTimeout);
      saveTimeout=setTimeout(()=>{
        if(!window._fbGetters) return;
        const data={
          produtos: window._fbGetters.produtos(),
          ordensAbertas: window._fbGetters.ordens(),
          ordensArquivadas: window._fbGetters.arquivadas(),
          movimentos: window._fbGetters.movs(),
          updatedAt: new Date().toISOString()
        };
        console.log('💾 Salvando no Firebase', data);
        db.ref('controle_semi_acabado_v2').set(data).then(()=>{
          setBadge('<span style="width:8px;height:8px;background:#22c55e;border-radius:50%"></span> Firebase OK - Sincronizado '+new Date().toLocaleTimeString('pt-BR'),'#065f46');
        }).catch(e=>{ console.error(e); setBadge('❌ Erro: '+e.message,'#7f1d1d'); });
      },800);
    };
    db.ref('.info/connected').on('value', s=>{
      if(s.val()) setBadge('<span style="width:8px;height:8px;background:#22c55e;border-radius:50%"></span> Firebase OK - Conectado','#065f46');
    });
    db.ref('teste_conexao').set({ok:true,hora:new Date().toISOString()}).then(()=>setBadge('<span style="width:8px;height:8px;background:#22c55e;border-radius:50%"></span> Firebase OK - Teste escrita funcionou!','#065f46'));
    // Escuta mudanças de outros dispositivos
    db.ref('controle_semi_acabado_v2').on('value', snap=>{
      const data=snap.val();
      if(!data) return;
      console.log('🔥 Dados recebidos de outro dispositivo', data);
      if(!window._fbSetters) return;
      isSyncingFromFirebase=true;
      try{
        if(data.produtos) window._fbSetters.produtos(data.produtos);
        if(data.ordensAbertas) window._fbSetters.ordens(data.ordensAbertas);
        if(data.ordensArquivadas) window._fbSetters.arquivadas(data.ordensArquivadas);
        if(data.movimentos) window._fbSetters.movs(data.movimentos);
      }finally{
        setTimeout(()=>{isSyncingFromFirebase=false;},500);
      }
      setBadge('<span style="width:8px;height:8px;background:#22c55e;border-radius:50%"></span> Firebase OK - Dados sincronizados '+new Date().toLocaleTimeString('pt-BR'),'#065f46');
    });
  })();
