 html+='<div class="lg:col-span-7 space-y-6"><div class="bg-white rounded-xl border overflow-hidden"><div class="px-5 h-12 flex items-center justify-between border-b bg-[var(--surface-2)]/60"><h2 class="text-[13px] font-extrabold">APONTAMENTO • LANÇAMENTO</h2><span class="text-[10px] px-2 py-1 rounded-full bg-amber-100 text-amber-700 border font-bold">Firebase • Auto-sync</span></div><div class="p-4 grid grid-cols-12 gap-2"><select id="mOrdem" class="col-span-4 h-10 px-2 rounded-lg border bg-[var(--surface-2)]/60 text-[12px] font-bold">'+ordensAbertas.map(o=>'<option value="'+o.id+'">'+o.id+' - '+o.cod+'</option>').join('')+'</select><select id="mTipo" class="col-span-3 h-10 px-2 rounded-lg border bg-[var(--surface-2)]/60 text-[11px] font-bold"><option value="INJECAO">INJEÇÃO</option><option value="TAMPOGRAFIA">TAMPOGRAFIA</option><option value="SAIDA">SAÍDA FINAL</option></select><select id="mCod" class="col-span-3 h-10 px-2 rounded-lg border bg-[var(--surface-2)]/60 text-[12px]">'+produtos.map(p=>'<option value="'+p.cod+'">'+p.cod+'</option>').join('')+'</select><input id="mQtd" type="number" placeholder="QTD" class="col-span-2 h-10 px-3 rounded-lg border bg-[var(--surface-2)]/60 text-[13px] font-bold"><button id="btnLanc" class="col-span-12 h-11 rounded-lg bg-[var(--success)] text-white font-black text-[12px]">LANÇAR MOVIMENTO</button></div><div class="px-4 pb-3 max-h-[220px] overflow-auto border-t"><table class="w-full text-[11px] mt-2"><thead class="text-[10px] text-[var(--text-muted)]"><tr><th class="text-left p-2">DATA</th><th class="text-left p-2">OP</th><th class="text-left p-2">TIPO</th><th class="text-left p-2">COD</th><th class="text-right p-2">QTD</th><th></th></tr></thead><tbody id="tbodyMov"></tbody></table></div></div>';

 app.innerHTML=html;
 document.getElementById('tbodyOP').innerHTML=(tab==="ABERTAS"?ordensAbertas:ordensArquivadas).map(o=>{const p=prog[o.id]||{inj:0,tamp:0}; const finalQtd=o.requerTampografia?p.tamp:p.inj; const perc=o.meta>0?(finalQtd/o.meta*100):0; const color=perc>=100?'bg-[var(--success)] text-white':perc>=50?'bg-[var(--info)] text-white':'bg-[var(--orange)] text-white'; return '<tr class="border-b hover:bg-[var(--surface-2)]"><td class="p-2"><div class="font-bold">'+o.id+'</div><div class="text-[11px] text-[var(--text-muted)]">'+o.cod+' • '+o.nomeProduto+'</div></td><td class="p-2 text-right font-bold">'+F(o.meta)+'</td><td class="p-2 text-right"><span class="px-2 py-1 rounded-full text-[10px] font-bold '+color+'">'+perc.toFixed(1)+'%</span></td><td class="p-2 text-[11px] text-[var(--text-muted)]">'+fmt(o.criadoEm)+'</td><td class="p-2 text-right"><button onclick="delOP(\''+o.id+'\',false)" class="h-6 w-6 rounded border text-[var(--danger)]">×</button></td></tr>';}).join('')||'<tr><td colspan="5" class="p-6 text-center text-[var(--text-muted)]">Nenhuma OP</td></tr>';
 document.getElementById('tbodyMov').innerHTML=[...movimentos].sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,80).map(m=>'<tr class="border-b"><td class="p-2 text-[11px] text-[var(--text-muted)]">'+fmt(m.data)+'</td><td class="p-2 font-bold">'+(m.ordemId||'-')+'</td><td class="p-2"><span class="px-2 py-1 rounded-full text-[10px] font-bold '+(m.tipo==='INJECAO'?'bg-[#dbeafe] text-[#1e40af]':m.tipo==='TAMPOGRAFIA'?'bg-[#f3e8ff] text-[#6b21a8]':'bg-[#fff3e8] text-[#9a3412]')+'">'+m.tipo+'</span></td><td class="p-2">'+m.cod+'</td><td class="p-2 text-right font-bold">'+F(m.qtd)+'</td><td class="p-2 text-right"><button onclick="delMov(\''+m.id+'\')" class="text-[var(--danger)]">×</button></td></tr>').join('');
 document.getElementById('tbodyEstoque').innerHTML=vals.map(e=>'<tr class="border-b hover:bg-[var(--surface-2)]"><td class="p-2"><div class="font-bold">'+e.cod+'</div><div class="text-[11px] text-[var(--text-muted)]">'+e.nome+' • '+e.peso+' kg/un</div></td><td class="p-2 text-right text-[var(--info)] font-bold">+'+F(e.entradasInjecao)+'</td><td class="p-2 text-right text-[var(--done)] font-bold">+'+F(e.entradasTampo)+'</td><td class="p-2 text-right text-[var(--orange)] font-bold">-'+F(e.saidas)+'</td><td class="p-2 text-right"><span class="px-2 py-1 rounded-full font-black text-[11px] '+(e.stockInjecao>0?'bg-[var(--info)] text-white':'bg-[var(--surface-2)] border text-[var(--text-muted)]')+'">'+F(e.stockInjecao)+'</span></td><td class="p-2 text-right"><span class="px-2 py-1 rounded-full font-black text-[11px] '+(e.stockFinal>0?'bg-[var(--success)] text-white':'bg-[var(--surface-2)] border text-[var(--text-muted)]')+'">'+F(e.stockFinal)+'</span></td><td class="p-2 text-right font-bold">'+(e.stockFinal*e.peso).toFixed(3)+' kg</td></tr>').join('')||'<tr><td colspan="7" class="p-6 text-center">Sem movimentação</td></tr>';
 document.getElementById('countInj').textContent=vals.filter(v=>v.stockInjecao>0).length+' COM INJ'; document.getElementById('countFin').textContent=vals.filter(v=>v.stockFinal>0).length+' FINAL';
 document.getElementById('btnLogout').onclick=()=>{localStorage.removeItem('i9_logado'); isLogged=false; render();};
 document.getElementById('btnAddProd').onclick=()=>{const cod=document.getElementById('pCod').value.trim().toUpperCase(),nome=document.getElementById('pNome').value.trim(),peso=parseFloat(document.getElementById('pPeso').value); if(!cod||!nome||isNaN(peso)) return alert('Preencha'); if(produtos.some(p=>p.cod===cod)) return alert('COD já existe'); produtos=[...produtos,{cod,nome,peso}]; render(); scheduleSave();};
 document.getElementById('btnAddOP').onclick=()=>{const id=document.getElementById('oId').value.trim().toUpperCase(),cod=document.getElementById('oCod').value,meta=parseInt(document.getElementById('oMeta').value),req=document.getElementById('oReqTamp').checked; if(!id||!cod||isNaN(meta)) return alert('Preencha'); if(ordensAbertas.some(o=>o.id===id)||ordensArquivadas.some(o=>o.id===id)) return alert('ID já existe'); const prod=produtos.find(p=>p.cod===cod); ordensAbertas=[{id,cod,nomeProduto:prod?.nome||cod,meta,criadoEm:new Date().toISOString(),requerTampografia:req},...ordensAbertas]; render(); scheduleSave();};
 document.getElementById('btnLanc').onclick=()=>{const ordemId=document.getElementById('mOrdem').value,tipo=document.getElementById('mTipo').value,cod=document.getElementById('mCod').value,qtd=parseInt(document.getElementById('mQtd').value); if(!ordemId||!cod||isNaN(qtd)||qtd<=0) return alert('Preencha'); const prod=produtos.find(p=>p.cod===cod); movimentos=[{id:'MOV-'+Date.now(),ordemId,tipo,cod,produto:prod?.nome||cod,qtd,pesoUnit:prod?.peso||0,data:new Date().toISOString()},...movimentos]; render(); scheduleSave();};
 document.querySelectorAll('.tabOP').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabOP').forEach(x=>x.className='tabOP px-3 py-1 rounded-full border bg-white text-[10px] font-bold'); b.className='tabOP px-3 py-1 rounded-full bg-[#2c3e50] text-white text-[10px] font-bold'; tab=b.dataset.tab; render();});
 document.getElementById('btnExport').onclick=()=>{const blob=new Blob([JSON.stringify({produtos,ordensAbertas,ordensArquivadas,movimentos},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup.json'; a.click();};
}
window.delProd=(cod)=>{ if(!confirm('Excluir '+cod+'?')) return; produtos=produtos.filter(p=>p.cod!==cod); render(); scheduleSave(); };
window.delOP=(id)=>{ if(!confirm('Excluir?')) return; ordensAbertas=ordensAbertas.filter(o=>o.id!==id); ordensArquivadas=ordensArquivadas.filter(o=>o.id!==id); render(); scheduleSave(); };
window.delMov=(id)=>{ movimentos=movimentos.filter(m=>m.id!==id); render(); scheduleSave(); };
render();
</script></body></html>
